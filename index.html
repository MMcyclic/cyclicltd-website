<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyclic LTD</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .container {
      text-align: center;
    }

    .logo {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .mark {
      width: 112px;
      height: 112px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0;
    }

    .entity {
      color: #555d66;
      font-size: 14px;
      letter-spacing: 2.4px;
      text-align: center;
      text-transform: uppercase;
    }

    .links {
      margin-top: 28px;
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      color: #111111;
      text-decoration: none;
      font-size: 16px;
      border-bottom: 1px solid #111111;
      padding-bottom: 3px;
    }

    a:hover {
      opacity: 0.65;
    }

    @media (max-width: 520px) {
      .mark {
        width: 96px;
        height: 96px;
      }

      h1 {
        font-size: 40px;
      }
    }

  </style>
</head>
<body>
  <main class="container">
    <div class="logo" aria-label="Cyclic LTD">
      <img class="mark" src="assets/cyclic-logo.svg" alt="Cyclic LTD logo" />
      <div>
        <h1>Cyclic</h1>
        <div class="entity">LTD</div>
      </div>
    </div>

    <div class="links">
      <a href="mailto:hiring@cyclicltd.xyz">Join us</a>
      <a href="mailto:info@cyclicltd.xyz">General Inquiries</a>
    </div>

  </main>
</body>
</html>
