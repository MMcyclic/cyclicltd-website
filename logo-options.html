<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyclic Logo Options</title>
  <style>
    :root {
      --ink: #111111;
      --muted: #5f656d;
      --line: #d9dde2;
      --paper: #f7f8f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 56px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
      font-weight: 600;
    }

    .note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      max-width: 620px;
    }

    .back {
      color: var(--ink);
      font-size: 14px;
      text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 3px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 420px);
      gap: 18px;
      justify-content: center;
    }

    .option {
      min-height: 292px;
      display: grid;
      align-content: space-between;
      gap: 22px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 88px;
    }

    .mark {
      width: 112px;
      height: 112px;
      flex: 0 0 auto;
    }

    .meta {
      display: grid;
      gap: 7px;
    }

    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: minmax(0, 420px);
      }
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 28px, 1180px);
        padding-top: 30px;
      }

      header {
        align-items: start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .option {
        min-height: 260px;
        padding: 20px;
      }

      .mark {
        width: 96px;
        height: 96px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Cyclic Selected Logo</h1>
        <p class="note">Editable SVG mark selected for the Cyclic LTD identity.</p>
      </div>
      <a class="back" href="index.html">Back to site</a>
    </header>

    <section class="grid" aria-label="Selected logo">
      <article class="option">
        <div class="logo-row">
          <img class="mark" src="assets/cyclic-logo.svg" alt="Cyclic LTD logo" />
        </div>
        <div class="meta">
          <h2>Candlestick Mark</h2>
          <p>A C-shaped monogram with candlestick structure, more explicit about markets while keeping the name as Cyclic LTD.</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
